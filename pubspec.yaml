name: flutter_inhouse
description: A Flutter plugin for tracking app installs, sessions, and user interactions with shortlinks and deep links using the TryInhouse SDK.
version: 1.0.2
homepage: https://github.com/28harishkumar/flutter-inhouse-sdk
repository: https://github.com/28harishkumar/flutter-inhouse-sdk

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: co.tryinhouse.flutter
        pluginClass: FlutterInhousePlugin
      ios:
        pluginClass: FlutterInhousePlugin

topics:
  - tracking
  - analytics
  - deeplinks
  - attribution
  - install-referrer
